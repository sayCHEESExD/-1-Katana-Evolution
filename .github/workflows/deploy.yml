# Deploy to Bloxity Hosting.
#
#   dev            -> Bloxity "dev" channel
#   main / master  -> Bloxity "prod" channel
#
# Two halves, because the game is two things: a Colyseus server that runs as a
# long-lived container, and a static Vite build. The server image goes to GHCR
# and is rolled by the Legion control plane; the client is built and uploaded
# to Bloxity Hosting as a zip.
#
# The client build is deliberately NOT gated on the server deploy. A static
# bundle that failed to upload leaves players on the previous one, which is a
# far better outcome than a half-deployed pair.
#
# Both routes below are the ones documented at https://hosting.bloxity.io/docs,
# and both were checked against the live API before being written here:
#
#   POST https://legion.bloxity.io/v1/apps/<gameId>/deploy          -> 401
#   POST https://api.bloxity.io/v1/hosting/games/<gameId>/frontend  -> 401
#
# 401 rather than 404 is the point: an unauthenticated request proves the route
# EXISTS without deploying anything. A deliberately invented neighbour of each
# ("/client") answers 404 on both hosts, so the 401s are meaningful rather than
# a blanket rejection. Nothing in this file is a guess.
name: Deploy to Bloxity

on:
  push:
    # dev -> the DEV channel, main -> the PROD channel. Exactly two branches
    # publish, so there is no third one that could quietly reach players.
    branches: [dev, main]
  # A manual re-run of the SAME mapping: run it on dev for DEV, on main for PROD.
  # The channel is never chosen by hand, so no other branch can reach players.
  workflow_dispatch:

concurrency:
  # One deploy per branch at a time. Two overlapping runs would race to publish
  # the same channel and the winner would be whichever finished last, not
  # whichever was newer.
  group: bloxity-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # THE GAME ID REGISTERED ON BLOXITY. Every route, every hostname and the
  # image name are built from this one string, so a game renamed on Bloxity is
  # a one-line change here.
  BLOXITY_GAME_ID: katana-evolve

  # The room's player cap, and the same number as MAX_PLAYERS_PER_ROOM. Legion
  # fills a pod to seatCap and then spawns the next one, so this MUST equal the
  # Colyseus room's maxClients: a larger figure here would have the matchmaker
  # send a sixteenth player to a room that refuses them.
  SEAT_CAP: '15'
  # The pod ceiling, so total capacity is 15 x 5 = 75 concurrent players.
  MAX_REPLICAS: '5'

  # Two DIFFERENT hosts, and that is not a typo: the control plane that rolls
  # container images is legion.bloxity.io, while the static-frontend upload
  # lives on api.bloxity.io. Both are written out rather than hidden behind
  # repository variables - the routes are documented and were verified, and a
  # settings knob nobody has set is just a second place for them to be wrong.
  LEGION_API: https://legion.bloxity.io
  HOSTING_API: https://api.bloxity.io

jobs:
  # Which channel this run publishes to, decided once so both jobs agree.
  channel:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
    steps:
      - id: pick
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # dev -> dev, main -> prod, and nothing else - pushes and manual runs alike.
          case "$REF_NAME" in
            dev)  CHANNEL="dev" ;;
            main) CHANNEL="prod" ;;
            *)
              echo "::error::Branch '$REF_NAME' does not deploy. Only dev (-> DEV) and main (-> PROD) publish."
              exit 1 ;;
          esac
          echo "name=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Deploying branch '$REF_NAME' to the '$CHANNEL' channel."

  # ------------------------------------------------------------------ server
  server:
    needs: channel
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to ghcr.io with the built-in GITHUB_TOKEN.
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR references must be entirely lower case, and a GitHub account name
      # need not be. Lowercasing the owner here keeps the image name valid
      # without hardcoding anybody's login into the file: the image goes to
      # the namespace of whoever owns this repository, pushed by the run's own
      # GITHUB_TOKEN. With the repository on a personal account that is
      # ghcr.io/<account>/katana-evolve-server.
      - name: Resolve the image name
        id: image
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${OWNER}/${BLOXITY_GAME_ID}-server" >> "$GITHUB_OUTPUT"

      # The image is only as good as what reaches the builder: this applies the
      # .dockerignore rules and fails if a file the Dockerfile copies - a
      # workspace manifest above all - would be excluded from the context.
      - name: Check the Docker build context
        run: node scripts/verify-docker-context.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          # The repository root: the Dockerfile installs the whole npm
          # workspace because the server imports @katana/shared.
          context: .
          file: ./Dockerfile
          push: true
          # Two tags: an IMMUTABLE "<channel>-<sha>", which is what gets
          # deployed, and a moving "<channel>" pointer for humans reading the
          # package list. Deploying the moving one would mean a re-run could
          # roll out whatever a later push had since overwritten.
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.channel.outputs.name }}-${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ needs.channel.outputs.name }}
          # A layer cache in the registry, so an unchanged lockfile does not
          # re-run "npm ci" on every push.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll the server on Legion
        env:
          TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}
          CHANNEL: ${{ needs.channel.outputs.name }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::LEGION_DEPLOY_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          IMAGE="${IMAGE_NAME}:${CHANNEL}-${GITHUB_SHA}"
          URL="${LEGION_API}/v1/apps/${BLOXITY_GAME_ID}/deploy"

          # seatCap and maxReplicas are numbers, not strings - hence --argjson.
          # No port is sent: Legion injects PORT and the server reads it.
          PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg image "$IMAGE" \
            --arg version "${GITHUB_SHA}" \
            --argjson seatCap "${SEAT_CAP}" \
            --argjson maxReplicas "${MAX_REPLICAS}" \
            '{channel: $channel, image: $image, version: $version, seatCap: $seatCap, maxReplicas: $maxReplicas}')

          echo "POST $URL"
          echo "$PAYLOAD" | jq .

          HTTP=$(curl -sS -o /tmp/deploy.out -w '%{http_code}' \
            -X POST "$URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD") || true

          echo "--- response ($HTTP) ---"
          cat /tmp/deploy.out || true
          echo

          {
            echo "LEGION_STATUS=$HTTP"
            echo "LEGION_BODY<<LEGION_EOF"
            head -c 800 /tmp/deploy.out 2>/dev/null || true
            echo
            echo "LEGION_EOF"
          } >> "$GITHUB_ENV"

          case "$HTTP" in
            2*) echo "Server rolled on '$CHANNEL' with seatCap ${SEAT_CAP}, maxReplicas ${MAX_REPLICAS}." ;;
            401|403)
              echo "::error::Legion rejected the token. Re-copy LEGION_DEPLOY_TOKEN from My Games on hosting.bloxity.io (the eye icon)."
              exit 1 ;;
            404)
              echo "::error::No such app on Legion - check that the game id '${BLOXITY_GAME_ID}' matches the one created on hosting.bloxity.io."
              exit 1 ;;
            *)  echo "::error::Server deploy failed with HTTP $HTTP."; exit 1 ;;
          esac

          if [ "$CHANNEL" = "dev" ]; then
            echo "Backend: https://${BLOXITY_GAME_ID}.dev.host.bloxity.io"
          else
            echo "Backend: https://${BLOXITY_GAME_ID}.host.bloxity.io"
          fi

      # A pushed image Legion cannot PULL looks like a successful deploy here and
      # a dead game to players: GHCR packages are PRIVATE by default. This asks
      # ghcr.io for an anonymous pull token - exactly what Legion needs - and
      # says how to fix it rather than failing a deploy that may be fine.
      - name: Check the image can be pulled anonymously
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -uo pipefail
          REPO="${IMAGE_NAME#ghcr.io/}"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${REPO}:pull" || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "Public: Legion can pull ${IMAGE_NAME}."
          else
            echo "::warning::ghcr.io/${REPO} is not anonymously pullable (HTTP $CODE). Legion cannot start the pod while the package is private. Fix: GitHub -> your profile/org -> Packages -> ${BLOXITY_GAME_ID}-server -> Package settings -> Change visibility -> Public."
            {
              echo "### Image visibility"
              echo "\`ghcr.io/${REPO}\` is **not** anonymously pullable (HTTP $CODE)."
              echo "Legion pulls anonymously, so make the package **public** or the backend cannot start."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A 2xx from Legion means ACCEPTED, not RUNNING: an image it cannot pull,
      # or a container that exits on boot, both leave the edge answering 503
      # (`game backend unreachable`). Poll the channel's own /health - the same
      # probe the container's HEALTHCHECK uses - so a dead backend shows up in
      # this run instead of in the game. A warning, not a failure: a backend
      # that has scaled to zero answers 503 too, and that is not a broken deploy.
      - name: Wait for the backend to answer /health
        env:
          CHANNEL: ${{ needs.channel.outputs.name }}
        run: |
          set -uo pipefail
          if [ "$CHANNEL" = "dev" ]; then
            HOST="${BLOXITY_GAME_ID}.dev.host.bloxity.io"
          else
            HOST="${BLOXITY_GAME_ID}.host.bloxity.io"
          fi
          echo "Polling https://${HOST}/health for up to 3 minutes."
          for attempt in $(seq 1 18); do
            CODE=$(curl -sS -o /tmp/health.out -w '%{http_code}' --max-time 10 "https://${HOST}/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Backend is live: $(cat /tmp/health.out)"
              echo "- Backend **live**: \`wss://${HOST}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "  attempt ${attempt}/18: HTTP $CODE $(head -c 120 /tmp/health.out 2>/dev/null)"
            sleep 10
          done
          {
            echo "### Backend did not come up"
            echo "\`https://${HOST}/health\` did not answer 200 within 3 minutes, though the image was pushed"
            echo "and Legion accepted the deploy. Check, in order:"
            echo "Legion answered **HTTP ${LEGION_STATUS:-?}** to the deploy, with:"
            echo ""
            echo "\`\`\`"
            echo "${LEGION_BODY:-(no body captured)}"
            echo "\`\`\`"
            echo ""
            echo "1. A **2xx** here means Legion ACCEPTED the deploy and then did not start the pod - the image"
            echo "   tag above exists, so this is Bloxity's side: check the channel on the dashboard."
            echo "2. The channel's logs on the Bloxity dashboard: a container that exits on boot looks like this."
            echo "3. Whether the image tag it was asked for exists in the registry (the push step above names it)."
          } >> "$GITHUB_STEP_SUMMARY"
          # On PROD this is an OUTAGE, and a silent one is how it went unnoticed
          # before: players get "not connected" while the run sits green. On DEV
          # it is only a warning, so a half-finished experiment does not block.
          # (A deployed backend answers /health even with nobody on it - an idle
          # pod is not the reason this probe fails.)
          if [ "$CHANNEL" = "prod" ]; then
            echo "::error::${HOST} never answered /health: PROD players cannot connect. See the job summary."
            exit 1
          fi
          echo "::warning::${HOST} never answered /health. The pod is not running - see the job summary."


  # ------------------------------------------------------------------ client
  client:
    needs: channel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines field and the Dockerfile's node:20 base.
          node-version: '20'
          cache: npm

      - run: npm ci

      # The repo's own gates, run before anything is published rather than
      # after: a build that typechecks but fails "verify" is a broken course,
      # and finding that out from players is finding out too late.
      - name: Typecheck and verify
        run: |
          npm run typecheck
          npm run verify

      - name: Build the client
        env:
          # Baked in at build time - Vite has no later step in which to inject
          # them, so a change here means a rebuild.
          VITE_BLOXITY_GAME_ID: ${{ env.BLOXITY_GAME_ID }}
          # The Colyseus endpoint for this channel, baked into the bundle.
          # Per-channel because dev and prod are separate backends, and wss://
          # because the page is served over https and a browser will not open
          # an insecure socket from a secure page. These are the documented
          # Bloxity backend hostnames for this game id:
          #   dev  -> wss://katana-evolve.dev.host.bloxity.io
          #   prod -> wss://katana-evolve.host.bloxity.io
          VITE_SERVER_URL: ${{ needs.channel.outputs.name == 'prod' && format('wss://{0}.host.bloxity.io', env.BLOXITY_GAME_ID) || format('wss://{0}.dev.host.bloxity.io', env.BLOXITY_GAME_ID) }}
        run: |
          set -euo pipefail
          echo "VITE_BLOXITY_GAME_ID=$VITE_BLOXITY_GAME_ID"
          echo "VITE_SERVER_URL=$VITE_SERVER_URL"
          npm run build:client

      - name: Check the build against the 12 MB budget
        run: npm run size:client

      - name: Package the client
        run: |
          set -euo pipefail
          test -f client/dist/index.html || { echo "::error::client/dist/index.html is missing - the build produced nothing."; exit 1; }
          # A ZIP, because that is what the hosting upload accepts. Zipped from
          # INSIDE client/dist so index.html sits at the archive root rather
          # than under a "dist" directory the host would serve as a subpath.
          (cd client/dist && zip -qr "${GITHUB_WORKSPACE}/client-dist.zip" .)
          ls -la client-dist.zip
          unzip -l client-dist.zip | head -20
          # index.html must be AT THE ROOT of the archive: Bloxity serves the
          # zip as the site, and one nested directory would serve a blank page.
          unzip -l client-dist.zip | grep -qE " index[.]html$" || { echo "::error::index.html is not at the root of client-dist.zip."; exit 1; }

      - name: Keep the bundle on the run
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ needs.channel.outputs.name }}-${{ github.sha }}
          path: client-dist.zip
          retention-days: 14

      - name: Upload the client to Bloxity Hosting
        env:
          TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}
          CHANNEL: ${{ needs.channel.outputs.name }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::LEGION_DEPLOY_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # "version" is required: it is what the dashboard compares against the
          # deployed backend to tell you whether the two halves match. The commit
          # sha is used for both, so a frontend and a backend from the same push
          # carry the same version string.
          URL="${HOSTING_API}/v1/hosting/games/${BLOXITY_GAME_ID}/frontend?channel=${CHANNEL}&version=${GITHUB_SHA}"
          echo "POST $URL"

          # The zip is the raw request BODY, not a multipart field.
          HTTP=$(curl -sS -o /tmp/upload.out -w '%{http_code}' \
            -X POST "$URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/zip' \
            --data-binary @client-dist.zip) || true

          echo "--- response ($HTTP) ---"
          cat /tmp/upload.out || true
          echo

          case "$HTTP" in
            2*) echo "Client published to the '$CHANNEL' channel." ;;
            401|403)
              echo "::error::Bloxity rejected the token. Re-copy LEGION_DEPLOY_TOKEN from My Games on hosting.bloxity.io (the eye icon)."
              exit 1 ;;
            *)  echo "::error::Client upload failed with HTTP $HTTP. The bundle is attached to this run as an artifact."; exit 1 ;;
          esac

          if [ "$CHANNEL" = "dev" ]; then
            echo "Frontend: https://${BLOXITY_GAME_ID}.dev.play.bloxity.io"
          else
            echo "Frontend: https://${BLOXITY_GAME_ID}.play.bloxity.io"
          fi
